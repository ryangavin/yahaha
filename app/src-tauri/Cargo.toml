[package]
name = "yahaha-app"
version = "0.1.0"
description = "yahaha: the app shell (Tauri) around the arranger engine"
license = "MIT"
repository = "https://github.com/ryangavin/yahaha"
edition = "2024"
rust-version = "1.85"

# A separate package, not part of the engine's build: `cargo build` at the repo root
# doesn't build it. Build it with `cargo tauri build` from app/.
[workspace]

[lib]
name = "yahaha_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.5", features = [] }
