# bacon (https://dystroy.org/bacon): the feedback loop. See AGENTS.md "Feedback loop".
#
# Run headless in a worktree with `bacon --headless`: bacon re-runs the job on every source
# change and rewrites the exports below after EVERY run, so an agent reads the result instead
# of running cargo itself.

default_job = "check"
# An edit during a run cancels it and starts over, so an export always covers every edit
# made before the run started.
on_change_strategy = "kill_then_restart"

# The fastest useful signal: everything (lib, bin, tests) type-checks, plugin code included.
# Plugin hosting is macOS only; elsewhere use `check-portable`.
[jobs.check]
command = ["cargo", "check", "--all-targets", "--features", "plugins", "--color", "always"]
need_stdout = false

[jobs.check-portable]
command = ["cargo", "check", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--features", "plugins", "--color", "always"]
need_stdout = false

# An agent's targeted tests: `bacon test -- <filter>` (the filter goes after `--`). Built with
# the `test-quick` profile (Cargo.toml): our crate unoptimised, so a rebuild is quick. The
# full suite and CI stay on `test-fast`.
[jobs.test]
command = ["cargo", "test", "--profile", "test-quick", "--features", "plugins", "--color", "always"]
need_stdout = true

# Written after every run (git-ignored): `error_code` (null = the command exited 0), `stats`
# (errors, warnings, test_fails), `failure_keys` (failed test names) and `lines` (each error,
# warning and failed test: location and message), plus the raw `output`. The file's mtime
# is the run's finish time. (The `locations` exporter was tried and dropped: it prints a
# failed test's kind as "???" with no message.)
[exports.json-report]
auto = true
path = ".bacon-result.json"
