# The checks in AGENTS.md, run directly. CI on the pull request is the final check before merge.
# The jobs run in parallel:
# - api-doc: docs/app-api.md against the code. Every PR.
# - linux-rust: the Rust checks and tests without plugins, slow tests included.
# - linux-app: the app shell's (app/src-tauri) no-plugins compile check.
# - macos-rust: the Rust tests with plugins, slow tests included.
# - macos-app: the app shell's tests, with plugins.
#
# The slow tests (`#[cfg(feature = "slow-tests")]`) are left out of the local core suite
# (AGENTS.md) and run only here. The app shell is a member of the root workspace (one
# Cargo.lock, one target directory); cargo at the root builds only the facade
# (default-members), so the Rust jobs pass `--workspace --exclude yahaha-app` to cover the
# layer crates under crates/ too, leaving the app shell to its own jobs.
# - web: the web app's `npm ci` and `npm run verify`, on Linux (it has nothing macOS-only).
# - linux and macos: the checks the branch rulesets require. linux passes when linux-rust and
#   linux-app passed or were skipped; macos when macos-rust, macos-app and web did.
#
# The Rust tests use the test-quick profile: our crate unoptimised (it compiles several
# times faster than at opt-level 2), the dependencies optimised, debug assertions and
# overflow checks on.
#
# Each change is checked once, where it counts:
# - On a PR into develop nothing builds or runs: every job is skipped, so the required
#   checks pass in seconds. Agents run the AGENTS.md checks that cover their change locally
#   before opening or updating a PR.
# - The develop merge queue runs everything on each queued group (the PR merged onto
#   develop's tip plus anything queued ahead of it), so nothing lands without passing CI on
#   exactly the code that lands. A group that fails drops out of the queue; fix and re-queue.
# - A push to develop (a merged PR) runs again: it checks the merged result.
# - Caches: no run of this workflow saves a Rust cache. A run can restore caches only from
#   its own ref and the default branch (main), so queue runs (refs gh-readonly-queue/...)
#   can't see caches saved under develop. seed-caches.yml runs after each develop push run,
#   on main, builds the same targets without running anything, and saves each job's cache
#   under main's scope with the key this file restores. setup-node saves the npm cache only
#   on a miss, which the seeded cache avoids.
# - Release PRs (develop into main) don't run: their head is develop's tip, which the push
#   run above already checked, and those checks count for the PR. Nothing runs on main.
# - Jobs a change can't affect are skipped (see `changes`). A skipped job counts as passed.
name: ci

on:
  pull_request:
    branches: [develop]
  merge_group:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas changed, file by file:
  # - rust: src/, crates/, tests/, examples/, benches/, Cargo.toml, Cargo.lock, app/src-tauri/, and
  #   app/src/lib/api/*.json (the Rust tests read the app's mock fixture, engine shape and
  #   assignable functions).
  # - web: app/ outside app/src-tauri/, tests/fixtures/ (a web test imports one), and
  #   README.md (app/src/help/readme.test.ts reads it).
  # - neither: other Markdown files (docs). Markdown under src/ or app/ counts as code (the
  #   capture kit, app/docs/controls.md). Nothing reads committed files under docs/.
  # - both: anything else (this workflow, the Dockerfile, ...).
  # With no usable base (a new branch) or an empty diff, everything counts as changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          rust=true
          web=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # PRs don't build: the merge queue runs CI (see the top of this file).
            rust=false
            web=false
          elif git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "$files"
            if [ -n "$files" ]; then
              rust=false
              web=false
              while IFS= read -r f; do
                case "$f" in
                  app/src-tauri/*) rust=true ;;
                  app/src/lib/api/*.json | tests/fixtures/*) rust=true; web=true ;;
                  app/* | README.md) web=true ;;
                  src/* | crates/* | tests/* | examples/* | benches/* | Cargo.toml | Cargo.lock) rust=true ;;
                  *.md) ;;
                  *) rust=true; web=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"

  # docs/app-api.md against the code: EVERY_CMD in tests/api_wire.rs names exactly the
  # commands in its AppCmd tables, and its JSON examples parse into the app API's types
  # (examples/api_doc_check.rs, which reads the doc at run time). Runs in every queue run,
  # docs-only ones included; skipped on PRs. The commands are in AGENTS.md.
  api-doc:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EVERY_CMD matches docs/app-api.md
        shell: bash
        run: |
          diff <(awk '/^## AppCmd/{f=1} /^### Result/{f=0} f && /^\| `/' docs/app-api.md | cut -d'|' -f2 | grep -o '`[^`]*`' | tr -d '`' | sort -u) <(awk '/^const EVERY_CMD/,/^\];/' tests/api_wire.rs | sed -n 's/^ *r#"{"type":"\([^"]*\)".*/\1/p' | sort -u)

      # cpal (a library dependency) links ALSA on Linux.
      - name: System packages (ALSA headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      # Its own key: this job builds only the library without features and one example.
      # Every Rust cache in this file has a stable key per job (its shared-key). This file
      # only restores them (save-if: false); seed-caches.yml saves them under main's scope,
      # the only scope queue runs can read besides their own, with exactly the same keys.
      # If you change a job's shared-key, workspace, toolchain, profile, features or build
      # commands here, change its seed-caches.yml job to match. cache-on-failure is kept
      # so the two files' rust-cache inputs stay identical.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: api-doc
          cache-on-failure: true
          save-if: false

      - name: JSON examples in docs/app-api.md parse into the Rust types
        run: cargo run --no-default-features --example api_doc_check -- docs/app-api.md

  # No `cargo check --all-targets`: `cargo test` builds every target it would (the library,
  # the binary, the tests and the example; there are no benches).
  linux-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cpal (a library dependency) links ALSA on Linux. The app shell's packages are only
      # needed in linux-app.
      - name: System packages (ALSA headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-rust
          cache-on-failure: true
          save-if: false

      - name: cargo check --no-default-features --lib
        run: cargo check --no-default-features --lib

      - name: cargo test --workspace --exclude yahaha-app --profile test-quick --features slow-tests
        run: cargo test --workspace --exclude yahaha-app --profile test-quick --features slow-tests

  # The app shell's tests run in macos-app (with plugins, as the real app builds). Here we
  # only prove the Linux (no-plugins) variant compiles.
  linux-app:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages (same as the Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-app
          cache-on-failure: true
          save-if: false

      - name: cargo check --all-targets (app/src-tauri)
        working-directory: app/src-tauri
        run: cargo check --all-targets

  # As in linux-rust, `cargo test` builds every target `cargo check --all-targets` would.
  macos-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust
          cache-on-failure: true
          save-if: false

      - name: cargo test --workspace --exclude yahaha-app --profile test-quick --features plugins,slow-tests
        run: cargo test --workspace --exclude yahaha-app --profile test-quick --features plugins,slow-tests

  macos-app:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-app
          cache-on-failure: true
          save-if: false

      # test-quick, as the engine's tests: locally the app's tests then reuse the engine's
      # dependency builds in the workspace's one target directory.
      - name: cargo test --profile test-quick (app/src-tauri)
        working-directory: app/src-tauri
        run: cargo test --profile test-quick

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci (app)
        working-directory: app
        run: npm ci

      - name: npm run verify (app)
        working-directory: app
        run: npm run verify

  # The branch rulesets require the checks `linux`, `macos` and `api-doc`. The old linux job
  # is now linux-rust and linux-app, and the old macos job macos-rust, macos-app and web,
  # all running in parallel. These two jobs keep the `linux` and `macos` checks: each passes
  # when every job it covers passed or was skipped, and fails otherwise.
  linux:
    needs: [changes, linux-rust, linux-app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: linux-rust and linux-app passed or were skipped
        run: |
          echo "changes: ${{ needs.changes.result }}, linux-rust: ${{ needs.linux-rust.result }}, linux-app: ${{ needs.linux-app.result }}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false

  macos:
    needs: [changes, macos-rust, macos-app, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: macos-rust, macos-app and web passed or were skipped
        run: |
          echo "changes: ${{ needs.changes.result }}, macos-rust: ${{ needs.macos-rust.result }}, macos-app: ${{ needs.macos-app.result }}, web: ${{ needs.web.result }}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
