# The checks in AGENTS.md, run directly. CI on the pull request is the final check before merge.
# The jobs run in parallel:
# - api-doc: docs/app-api.md against the code. Every PR.
# - linux: the Rust checks and tests without plugins, and the app shell's no-plugins compile check.
# - macos-rust: the Rust tests with plugins.
# - macos-app: the app shell's (app/src-tauri) tests, with plugins.
# - web: the web app's `npm ci` and `npm run verify`, on Linux (it has nothing macOS-only).
# - macos: passes when macos-rust, macos-app and web passed or were skipped. It keeps the
#   `macos` check the branch rulesets require.
#
# The Rust tests use the test-quick profile: our crate unoptimised (it compiles in about a
# third of the time), the dependencies optimised, debug assertions and overflow checks on.
#
# Each commit is checked once:
# - PRs into develop run on the PR.
# - A push to develop (a merged PR) runs again: it checks the merged result and seeds the
#   develop caches that PR runs restore from (a PR's own cache is only visible to that PR).
# - Release PRs (develop into main) don't run: their head is develop's tip, which the push
#   run above already checked, and those checks count for the PR. Nothing runs on main.
# - Jobs a change can't affect are skipped (see `changes`). A skipped job counts as passed.
name: ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas changed, file by file:
  # - rust: src/, tests/, examples/, benches/, Cargo.toml, Cargo.lock, app/src-tauri/, and
  #   app/src/lib/api/*.json (the Rust tests read the app's mock fixture, engine shape and
  #   assignable functions).
  # - web: app/ outside app/src-tauri/, tests/fixtures/ (a web test imports one), and
  #   README.md (app/src/help/readme.test.ts reads it).
  # - neither: other Markdown files (docs). Markdown under src/ or app/ counts as code (the
  #   capture kit, app/docs/controls.md). Nothing reads committed files under docs/.
  # - both: anything else (this workflow, the Dockerfile, ...).
  # With no usable base (a new branch) or an empty diff, everything counts as changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rust=true
          web=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "$files"
            if [ -n "$files" ]; then
              rust=false
              web=false
              while IFS= read -r f; do
                case "$f" in
                  app/src-tauri/*) rust=true ;;
                  app/src/lib/api/*.json | tests/fixtures/*) rust=true; web=true ;;
                  app/* | README.md) web=true ;;
                  src/* | tests/* | examples/* | benches/* | Cargo.toml | Cargo.lock) rust=true ;;
                  *.md) ;;
                  *) rust=true; web=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"

  # docs/app-api.md against the code: EVERY_CMD in tests/api_wire.rs names exactly the
  # commands in its AppCmd tables, and its JSON examples parse into the app API's types
  # (examples/api_doc_check.rs, which reads the doc at run time). Runs on every PR,
  # docs-only ones included; the commands are in AGENTS.md.
  api-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EVERY_CMD matches docs/app-api.md
        shell: bash
        run: |
          diff <(awk '/^## AppCmd/{f=1} /^### Result/{f=0} f && /^\| `/' docs/app-api.md | cut -d'|' -f2 | grep -o '`[^`]*`' | tr -d '`' | sort -u) <(awk '/^const EVERY_CMD/,/^\];/' tests/api_wire.rs | sed -n 's/^ *r#"{"type":"\([^"]*\)".*/\1/p' | sort -u)

      # cpal (a library dependency) links ALSA on Linux.
      - name: System packages (ALSA headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      # Its own key: this job builds only the library without features and one example.
      # Every Rust cache in this file has a stable key per job, so PRs restore the cache
      # develop's push run seeds, and is saved only by that run (save-if): PR runs don't
      # add caches of their own, which kept pushing the repo past GitHub's 10 GB cache
      # limit and evicting develop's. cache-on-failure so a develop run that fails partway
      # through still saves what it built.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: api-doc
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: JSON examples in docs/app-api.md parse into the Rust types
        run: cargo run --no-default-features --example api_doc_check -- docs/app-api.md

  # No `cargo check --all-targets`: `cargo test` builds every target it would (the library,
  # the binary, the tests and the example; there are no benches).
  linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages (same as the Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: cargo check --no-default-features --lib
        run: cargo check --no-default-features --lib

      - name: cargo test --profile test-quick
        run: cargo test --profile test-quick

      # The app shell's tests run in macos-app (with plugins, as the real app builds). Here
      # we only prove the Linux (no-plugins) variant compiles.
      - name: cargo check --all-targets (app/src-tauri)
        working-directory: app/src-tauri
        run: cargo check --all-targets

  # As in linux, `cargo test` builds every target `cargo check --all-targets` would.
  macos-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: cargo test --profile test-quick --features plugins
        run: cargo test --profile test-quick --features plugins

  macos-app:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-app
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          workspaces: app/src-tauri -> target

      - name: cargo test (app/src-tauri)
        working-directory: app/src-tauri
        run: cargo test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci (app)
        working-directory: app
        run: npm ci

      - name: npm run verify (app)
        working-directory: app
        run: npm run verify

  # The branch rulesets require the checks `linux`, `macos` and `api-doc`. The old macos job
  # is now macos-rust, macos-app and web, running in parallel; this job keeps the `macos`
  # check and passes when each of them passed or was skipped.
  macos:
    needs: [changes, macos-rust, macos-app, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: macos-rust, macos-app and web passed or were skipped
        run: |
          echo "changes: ${{ needs.changes.result }}, macos-rust: ${{ needs.macos-rust.result }}, macos-app: ${{ needs.macos-app.result }}, web: ${{ needs.web.result }}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
