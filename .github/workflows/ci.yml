# The checks in AGENTS.md, run directly. CI on the pull request is the final check before merge.
# linux: Rust checks and tests without plugins, plus the app shell's Rust tests.
# macos: the plugins build and tests, plus the web app's verify.
#
# Each commit is checked once:
# - PRs into develop run on the PR.
# - A push to develop (a merged PR) runs again: it checks the merged result and seeds the
#   develop cache that PR runs restore from (a PR's own cache is only visible to that PR).
# - Release PRs (develop into main) don't run: their head is develop's tip, which the push
#   run above already checked, and those checks count for the PR. Nothing runs on main.
# - Docs-only changes skip linux and macos (see `changes`). A skipped job counts as passed.
name: ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether anything but docs changed. Docs = Markdown files, except the ones code reads:
  # anything under src/ (the capture kit) or app/ (app/docs/controls.md), and README.md
  # (app/src/help/readme.test.ts). Nothing reads committed files under docs/. With no usable base (a new branch),
  # everything counts as changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "$files"
            if [ -n "$files" ] \
              && ! printf '%s\n' "$files" | grep -qvE '\.md$' \
              && ! printf '%s\n' "$files" | grep -qE '^(src/|app/|README\.md$)'; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # docs/app-api.md against the code: EVERY_CMD in tests/api_wire.rs names exactly the
  # commands in its AppCmd tables, and its JSON examples parse into the app API's types
  # (examples/api_doc_check.rs, which reads the doc at run time). Runs on every PR,
  # docs-only ones included; the commands are in AGENTS.md.
  api-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EVERY_CMD matches docs/app-api.md
        shell: bash
        run: |
          diff <(awk '/^## AppCmd/{f=1} /^### Result/{f=0} f && /^\| `/' docs/app-api.md | cut -d'|' -f2 | grep -o '`[^`]*`' | tr -d '`' | sort -u) <(awk '/^const EVERY_CMD/,/^\];/' tests/api_wire.rs | sed -n 's/^ *r#"{"type":"\([^"]*\)".*/\1/p' | sort -u)

      # cpal (a library dependency) links ALSA on Linux.
      - name: System packages (ALSA headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      # Its own key: this job builds only the library without features and one example.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: api-doc
          cache-on-failure: true

      - name: JSON examples in docs/app-api.md parse into the Rust types
        run: cargo run --no-default-features --example api_doc_check -- docs/app-api.md

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages (same as the Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      # A stable key per job, so PRs read the cache develop's own run seeds (the first
      # develop run after a merge populates it for later PRs to reuse); cache-on-failure
      # so a run that fails partway through still saves what it built.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          cache-on-failure: true
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: cargo check --all-targets
        run: cargo check --all-targets

      - name: cargo check --no-default-features --lib
        run: cargo check --no-default-features --lib

      - name: cargo test --profile test-fast
        run: cargo test --profile test-fast

      # The app shell's tests run once, in the macos job (with plugins, as the real app
      # builds). Here we only prove the Linux (no-plugins) variant compiles.
      - name: cargo check --all-targets (app/src-tauri)
        working-directory: app/src-tauri
        run: cargo check --all-targets

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Same idea as the linux job's cache (stable key, cache-on-failure).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          cache-on-failure: true
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: cargo check --all-targets --features plugins
        run: cargo check --all-targets --features plugins

      - name: cargo test --profile test-fast --features plugins
        run: cargo test --profile test-fast --features plugins

      - name: cargo test (app/src-tauri)
        working-directory: app/src-tauri
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci (app)
        working-directory: app
        run: npm ci

      - name: npm run verify (app)
        working-directory: app
        run: npm run verify
