# Seeds the build caches that ci.yml's merge-queue runs restore. It runs no tests and reports
# no checks; it only builds and saves caches.
#
# Why a separate workflow: a run can restore caches only from its own ref and the repository's
# default branch (main). Queue runs have refs like gh-readonly-queue/develop/..., so they can't
# see caches saved by develop's push runs. A workflow_run run always runs on the default
# branch, so the caches this workflow saves land in main's scope, which every queue run (and
# every develop push run) can restore.
#
# workflow_run only fires for workflow files on the default branch, so this starts working
# once it has been merged into main.
#
# Each job below restores and saves exactly the cache its ci.yml job restores: the same
# rust-cache shared-key, the same toolchain (dtolnay/rust-toolchain@stable), the same
# workspace, and no extra CARGO*/RUST*/CC* environment variables (rust-cache hashes those
# into the key). It builds the same targets with the same profile and features, with
# `--no-run` in place of running the tests. When the key is already cached exactly (the
# usual case: it only changes with Cargo.lock, the Cargo.toml dependencies or a new stable
# Rust), the job skips the build and saves nothing.
#
# Security: workflow_run runs with the default branch's write-capable context. This workflow
# only acts on ci runs triggered by a push to develop in this repository (never a PR),
# checks out that run's own commit without persisting credentials, and has read-only
# contents permission.
name: seed-caches

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop]
  # Manual run from main: seeds from develop's tip.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-caches
  cancel-in-progress: true

env:
  SHA: ${{ github.event.workflow_run.head_sha || 'develop' }}

jobs:
  api-doc:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: api-doc
          cache-on-failure: true

      - name: System packages (ALSA headers)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - name: cargo build --no-default-features --example api_doc_check
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --no-default-features --example api_doc_check

  linux-rust:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-rust
          cache-on-failure: true

      - name: System packages (ALSA headers)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - name: cargo check --no-default-features --lib
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo check --no-default-features --lib

      - name: cargo test --profile test-quick --features slow-tests --no-run
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo test --profile test-quick --features slow-tests --no-run

  linux-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-app
          cache-on-failure: true

      - name: System packages (same as the Dockerfile)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: cargo check --all-targets (app/src-tauri)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: app/src-tauri
        run: cargo check --all-targets

  macos-rust:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust
          cache-on-failure: true

      - name: cargo test --profile test-quick --features plugins,slow-tests --no-run
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo test --profile test-quick --features plugins,slow-tests --no-run

  macos-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-app
          cache-on-failure: true

      - name: cargo test --profile test-quick --no-run (app/src-tauri)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: app/src-tauri
        run: cargo test --profile test-quick --no-run

  # setup-node's npm cache (~/.npm) is keyed on the OS, the architecture and
  # app/package-lock.json, as in ci.yml's web job. setup-node saves it only on a miss.
  web:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci (app)
        if: steps.node.outputs.cache-hit != 'true'
        working-directory: app
        run: npm ci
