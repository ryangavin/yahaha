# Genos parity research: the concept list.
#
# One [[topic]] per concept. The scripts in scripts/ read this file (Python's
# built-in tomllib, no dependencies). Fields:
#   id        short slug; notes go to notes/<id>.md
#   title     human name
#   feel      true for playing-feel topics (research these deeper)
#   queries   YouTube search queries (yt-dlp "ytsearchN:<query>")
#   keywords  words to look for in transcripts when picking timestamps
#   manual    manual refs: OM = Genos2 Owner's Manual, RM = Genos2 Reference
#             Manual, DL = Genos Data List (printed page numbers)
#   yahaha    where yahaha implements (or would implement) it
#
# Add topics freely; keep ids stable because notes and the matrix refer to them.

[[topic]]
id = "sections"
title = "Style sections: Intro / Main / Fill / Break / Ending subtleties"
feel = true
queries = [
  "Genos style sections intro main fill break ending tutorial",
  "Yamaha Genos how to play styles like a pro fills breaks",
  "Genos 2 ending ritardando intro count in",
]
keywords = ["intro", "ending", "break", "fill", "variation", "main a", "rit", "count"]
manual = ["OM p.66-68", "RM p.12", "DL p.111"]
yahaha = ["docs/section-timing.md", "docs/fills-and-rules.md", "src/engine/sections.rs", "src/engine/fills.rs"]

