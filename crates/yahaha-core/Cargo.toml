[package]
name = "yahaha-core"
version = "0.1.0"
edition = "2024"
description = "yahaha: the bottom layer (real-time helpers, MIDI, music theory, data tables) every other crate builds on"
license = "MIT"
repository = "https://github.com/satoramoto/yahaha"

# The crate split (AGENTS.md, Layering): core depends on no other yahaha crate.

[features]
# Tests gated with `#[cfg(feature = "slow-tests")]` run in CI only (AGENTS.md).
slow-tests = []

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CoreMIDI and Mach: macOS and iOS (iPad). On Linux (development only) rt uses libc
# instead.
[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.10.1"
coremidi-sys = "3.2.1"
mach2 = "0.7.0"
