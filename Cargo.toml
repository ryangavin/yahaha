[package]
name = "yahaha"
version = "0.1.0"
edition = "2024"
description = "A software arranger keyboard that plays Yamaha Genos/PSR style files live from your MIDI keyboard"
license = "MIT"
repository = "https://github.com/ryangavin/yahaha"

# The engine, the runtime and the app API are the `yahaha` library; the terminal front
# panel and the developer tools are the `yahaha` binary. A client such as the desktop
# app depends on the library alone: `yahaha = { path = "..", default-features = false }`.
[lib]
path = "src/lib.rs"

[[bin]]
name = "yahaha"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
# The terminal UI (ratatui, crossterm). Only the binary needs it.
tui = ["dep:ratatui", "dep:crossterm"]
# Plugin hosting (#35): Audio Unit instruments (src/plugin/, `yahaha plugin-test`). Off by
# default. Pulls in the objc2 framework bindings below; none of them is built otherwise.
plugins = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-core-audio-types",
    "dep:objc2-audio-toolbox",
    "dep:objc2-app-kit",
    "dep:objc2-core-audio-kit",
    "dep:block2",
]

[dependencies]
anyhow = "1.0.104"
core-foundation = "0.10.1"
coremidi-sys = "3.2.1"
cpal = "0.18.2"
crossterm = { version = "0.29.0", optional = true }
libc = "0.2.189"
mach2 = "0.7.0"
ratatui = { version = "0.30.2", optional = true }
rtrb = "0.4.0"
# rustysynth 1.3.6 (MIT, https://github.com/sinshu/rustysynth), vendored with two patches,
# each marked "yahaha:" in vendor/rustysynth/src:
# - `Synthesizer::channel_peaks`, each MIDI channel's level for the mixer meters
#   (synthesizer.rs);
# - velocity -> filter cutoff (#203), so a soft note is darker as well as quieter: the SF2
#   2.01 default modulator, and the SoundFont's own velocity -> filter modulators from
#   pmod/imod (modulator.rs, new; upstream read no modulators; every other modulator is
#   still ignored). `SynthesizerSettings::velocity_to_filter = false` renders as upstream.
rustysynth = { path = "vendor/rustysynth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plugin hosting only (the `plugins` feature). The objc2 project's generated bindings to
# AudioToolbox, CoreAudioKit and AppKit; cpal already depends on objc2 / audio-toolbox.
[dependencies.objc2]
version = "0.6.4"
optional = true
features = ["exception"]

[dependencies.block2]
version = "0.6.2"
optional = true

[dependencies.objc2-foundation]
version = "0.3.2"
optional = true
default-features = false
features = ["std", "NSString", "NSBundle", "NSURL", "NSObject", "NSDate", "NSRunLoop", "NSGeometry", "NSThread"]

[dependencies.objc2-core-foundation]
version = "0.3.2"
optional = true
default-features = false
features = ["std", "CFString", "CFData", "CFError", "CFPropertyList"]

[dependencies.objc2-core-audio-types]
version = "0.3.2"
optional = true
default-features = false
features = ["std", "CoreAudioBaseTypes"]

[dependencies.objc2-audio-toolbox]
version = "0.3.2"
optional = true
default-features = false
features = ["std", "AudioComponent", "AUComponent", "AudioUnitProperties", "MusicDevice", "block2", "objc2-core-audio-types", "objc2-core-foundation"]

[dependencies.objc2-app-kit]
version = "0.3.2"
optional = true
default-features = false
features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSViewController", "NSGraphics", "NSEvent", "objc2-core-foundation"]

[dependencies.objc2-core-audio-kit]
version = "0.3.2"
optional = true
default-features = false
features = ["std", "AUGenericView", "objc2-app-kit", "objc2-audio-toolbox"]
