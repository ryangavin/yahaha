[package]
name = "yahaha"
version = "0.1.0"
edition = "2024"
description = "A software arranger keyboard that plays Yamaha Genos/PSR style files live from your MIDI keyboard"
license = "MIT"
repository = "https://github.com/ryangavin/yahaha"

[dependencies]
anyhow = "1.0.104"
core-foundation = "0.10.1"
coremidi-sys = "3.2.1"
cpal = "0.18.2"
crossterm = "0.29.0"
libc = "0.2.189"
mach2 = "0.7.0"
ratatui = "0.30.2"
rtrb = "0.4.0"
rustysynth = "1.3.6"
